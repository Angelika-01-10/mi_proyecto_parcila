<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <div class="card">
        <h2>Iniciar Sesión</h2><a th:href="@{/index}" class="btn-crear">Volver al inicio</a>

        <form th:action="@{/login}" method="post" class="login-form">
            <input type="email" name="username" placeholder="Correo electrónico" required>
            <input type="password" name="password" placeholder="Contraseña" required>
            <button type="submit">Ingresar</button>
            <p th:if="${param.logout}" class="success-msg">Has cerrado sesión correctamente</p>
        </form>
    </div>
</div>
</body>
</html>
