<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Agregar Nota</title>
</head>
<body>
    <h2>Agregar Nota a Estudiante</h2>
    <form th:action="@{/coordinador/agregar-nota}" th:object="${resultado}" method="post">
        <input type="hidden" th:field="*{estudianteId}" th:value="${estudianteId}"/>

        <label>Materia:</label>
        <input type="text" th:field="*{materia}" required/><br/>

        <label>Puntaje:</label>
        <input type="number" step="0.01" th:field="*{puntaje}" required/><br/>

        <label>Beneficio:</label>
        <input type="text" th:field="*{beneficio}"/><br/>

        <button type="submit">Guardar Nota</button>
    </form>
    <br/>
    <a href="/coordinador/lista">Volver a lista de estudiantes</a>
</body>
</html>
