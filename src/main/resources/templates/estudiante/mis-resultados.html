<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Mis Resultados</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 20px;
        }
        table {
            border-collapse: collapse;
            width: 100%;
            background: white;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: center;
        }
        th {
            background-color: #007bff;
            color: white;
        }
    </style>
</head>
<body>
<h2 th:text="'Bienvenido, ' + ${estudiante.nombre}"></h2>
<h3>Resultados</h3>
<table>
    <tr>
        <th>Materia</th>
        <th>Puntaje</th>
    </tr>
    <tr th:each="resultado : ${resultados}">
        <td th:text="${resultado.materia}"></td>
        <td th:text="${resultado.puntaje}"></td>
    </tr>
</table>
<br>
<a href="/logout">Cerrar sesión</a>
</body>
</html>
